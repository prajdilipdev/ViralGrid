name: Keep backend awake

# Render's free tier shuts the backend down after ~15 minutes with no traffic,
# and a sleeping server cannot run its own scheduler — so a post scheduled for
# 9am only publishes whenever something next wakes it. This pings the health
# endpoint on a timer so the server stays up and scheduled posts fire on time.
#
# WHY NOT 24/7: the free plan allows 750 instance-hours per month. Running
# around the clock costs ~744 in a 31-day month, which leaves almost no margin
# and risks the service being suspended. The window below covers roughly
# 05:30–00:30 IST (~19h/day, ~600h/month), which is comfortably inside it.
#
# To change the window, edit the hour range in the cron line (hours are UTC;
# IST is UTC+5:30). To run it round the clock, use '*/30 * * * *' and keep an
# eye on your Render usage.

on:
  schedule:
    - cron: "*/30 0-18 * * *" # every 30 min, 00:00–18:59 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Never let two pings overlap.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the backend health endpoint
        env:
          URL: https://viralgrid-backend.onrender.com/api/health
        run: |
          # A cold start takes ~50s, so allow a generous timeout and retry
          # rather than reporting a false failure.
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 120 "$URL") || code=000
            elapsed=$(( $(date +%s) - start ))

            if [ "$code" = "200" ]; then
              if [ "$elapsed" -gt 15 ]; then
                echo "Woke the server (took ${elapsed}s — it had gone to sleep)."
              else
                echo "Server already awake (${elapsed}s)."
              fi
              echo "Response: $(cat /tmp/body)"
              exit 0
            fi

            echo "Attempt ${attempt}: HTTP ${code} after ${elapsed}s"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo "::error::Backend did not respond after 3 attempts. It may be down, suspended, or out of free instance hours."
          exit 1

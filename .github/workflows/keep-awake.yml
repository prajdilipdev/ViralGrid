name: Keep backend awake

# Render's free tier shuts the backend down after ~15 minutes with no traffic,
# and a sleeping server cannot run its own scheduler — so a post set for 9am
# only publishes whenever something next wakes it. This pings the health
# endpoint on a timer.
#
# BUDGET (this is the part that matters):
# The free plan allows 750 instance-hours per month. A ping does NOT cost two
# hours of uptime — it costs about 15 minutes, because the server serves the
# request and then idles back to sleep long before the next one. So:
#
#   12 pings/day x ~0.25h  =  ~3h/day  =  ~93h/month
#   750 - 93               =  ~657h/month left over for your own use
#
# That is roughly 21 hours a day of personal use before the allowance is at
# risk, so logging in daily is not a problem. Pinging every 30 minutes instead
# would keep the server up continuously and cost ~750h/month — the entire
# allowance, with nothing spare — which is why this runs every 2 hours.
#
# TRADE-OFF: the server is asleep between pings, so a scheduled post can go out
# up to ~2 hours after its time, and the first page load after a gap still
# takes ~50s to wake. To publish closer to on-time, shorten the interval (and
# recheck the budget above); to conserve more, lengthen it.

on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours, on the hour (UTC), round the clock
  workflow_dispatch: # run it by hand from the Actions tab

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the backend health endpoint
        env:
          URL: https://viralgrid-backend.onrender.com/api/health
        run: |
          # A cold start takes ~50s, so allow a generous timeout and retry
          # rather than reporting a false failure.
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 120 "$URL") || code=000
            elapsed=$(( $(date +%s) - start ))

            if [ "$code" = "200" ]; then
              if [ "$elapsed" -gt 15 ]; then
                echo "Woke the server (took ${elapsed}s — it had gone to sleep)."
              else
                echo "Server already awake (${elapsed}s)."
              fi
              echo "Response: $(cat /tmp/body)"
              exit 0
            fi

            echo "Attempt ${attempt}: HTTP ${code} after ${elapsed}s"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo "::error::Backend did not respond after 3 attempts. It may be down, suspended, or out of free instance hours."
          exit 1
